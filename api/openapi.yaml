openapi: 3.0.3
info:
  title: Youth Football Performance Monitoring API
  version: 0.1.0-draft
  description: Draft contract (prototype for API-level interaction). Synthetic examples only.
servers: [{url: http://localhost:8000/api/v1}]
security: [{bearerAuth: []}]
paths:
  /auth/login:
    post:
      summary: Sign in
      security: []
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Login'}}}}
      responses: {'200': {description: Token issued}, '401': {description: Invalid credentials}}
  /teams:
    get: {summary: List teams visible to the user, responses: {'200': {description: OK}}}
    post: {summary: Create team (admin), responses: {'201': {description: Created}, '403': {description: Forbidden}}}
  /teams/{teamId}/players:
    get:
      summary: List players of a team
      parameters: [{name: teamId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: OK}, '403': {description: Not your team}}
  /players:
    post:
      summary: Create player (pseudonymised)
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlayerCreate'}}}}
      responses: {'201': {description: Created}, '422': {description: Validation error}}
  /players/{playerId}/tests:
    post:
      summary: Record a field-test result
      parameters: [{name: playerId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/TestResult'}}}}
      responses: {'201': {description: Created}, '422': {description: Value outside plausible range}}
  /sessions:
    post:
      summary: Record a training session with per-player RPE and attendance
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SessionCreate'}}}}
      responses: {'201': {description: Created, load computed as RPE x duration}}
  /imports/csv:
    post:
      summary: Import CSV (tests, sessions or external load) and get a validation report
      requestBody: {required: true, content: {multipart/form-data: {schema: {type: object, properties: {kind: {type: string, enum: [tests, sessions, external_load]}, file: {type: string, format: binary}}}}}}
      responses: {'200': {description: Import report with accepted and rejected rows}}
  /players/{playerId}/kpis:
    get:
      summary: KPI values, z-scores and trends
      parameters: [{name: playerId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/KpiSummary'}}}}}
  /players/{playerId}/recommendations:
    get:
      summary: Generate/read recommendations with explanations
      parameters: [{name: playerId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Recommendation'}}}}}}
  /recommendations/{id}/decision:
    post:
      summary: Coach decision on a recommendation
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Decision'}}}}
      responses: {'201': {description: Stored}}
components:
  securitySchemes: {bearerAuth: {type: http, scheme: bearer}}
  schemas:
    Login: {type: object, required: [email, password], properties: {email: {type: string}, password: {type: string}}}
    PlayerCreate:
      type: object
      required: [pseudonym, birth_date, team_id, consent]
      properties: {pseudonym: {type: string, example: P-017}, birth_date: {type: string, format: date}, position: {type: string, enum: [GK, DF, MF, FW]}, team_id: {type: string, format: uuid}, consent: {type: boolean}}
    TestResult:
      type: object
      required: [kpi_id, value, tested_on]
      properties: {kpi_id: {type: string, enum: [K-SPR10, K-SPR30, K-AGI, K-CMJ, K-END], example: K-SPR30}, value: {type: number, example: 4.85}, tested_on: {type: string, format: date}, method: {type: string, example: timing_gates}}
    SessionCreate:
      type: object
      required: [team_id, held_on, duration_min, entries]
      properties:
        team_id: {type: string, format: uuid}
        held_on: {type: string, format: date}
        duration_min: {type: integer, minimum: 1}
        entries: {type: array, items: {type: object, required: [player_id, attended], properties: {player_id: {type: string, format: uuid}, attended: {type: boolean}, rpe: {type: integer, minimum: 0, maximum: 10}}}}
    KpiSummary:
      type: object
      properties:
        player_id: {type: string}
        kpis: {type: array, items: {type: object, properties: {kpi_id: {type: string}, latest: {type: number}, z_score_cohort: {type: number}, cohort: {type: string, example: U14}, n_observations: {type: integer}}}}
    Recommendation:
      type: object
      required: [id, rule_id, text, rationale, inputs, rule_set_version]
      properties: {id: {type: string}, rule_id: {type: string, example: R-01}, text: {type: string}, rationale: {type: string}, inputs: {type: object}, rule_set_version: {type: string}}
    Decision: {type: object, required: [outcome], properties: {outcome: {type: string, enum: [accepted, modified, rejected]}, comment: {type: string}}}
